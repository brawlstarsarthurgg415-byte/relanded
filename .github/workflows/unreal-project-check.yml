name: Unreal project structure check

"on":
  push:
    paths:
      - ".github/workflows/unreal-project-check.yml"
      - "Relanded.uproject"
      - "Source/**"
      - "Config/**"
      - "Content/ThirdParty/**"
      - "Tools/**"
  pull_request:
    paths:
      - ".github/workflows/unreal-project-check.yml"
      - "Relanded.uproject"
      - "Source/**"
      - "Config/**"
      - "Content/ThirdParty/**"
      - "Tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm runner
        run: echo "Checkout and runner are working"
