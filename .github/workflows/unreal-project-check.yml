name: Unreal project structure check

"on":
  push:
    paths:
      - ".github/workflows/unreal-project-check.yml"
      - "Relanded.uproject"
      - "Source/**"
      - "Config/**"
      - "Content/ThirdParty/**"
      - "Tools/**"
  pull_request:
    paths:
      - ".github/workflows/unreal-project-check.yml"
      - "Relanded.uproject"
      - "Source/**"
      - "Config/**"
      - "Content/ThirdParty/**"
      - "Tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Unreal project descriptor
        run: |
          python3 - <<'PY'
          import json
          with open("Relanded.uproject", encoding="utf-8") as project_file:
              project = json.load(project_file)
          assert project["Modules"][0]["Name"] == "Relanded"
          print("Unreal project descriptor: OK")
          PY
