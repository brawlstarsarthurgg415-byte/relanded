name: Build Relanded Android APK (Godot)

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Download Godot 4.5.1 and Android export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -L --fail -o "$HOME/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          curl -L --fail -o "$HOME/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp "$HOME/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          chmod +x "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Validate project
        run: |
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --editor --path godot --quit

      - name: Export Android APK
        run: |
          mkdir -p artifacts
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path godot --export-debug "Android" artifacts/Relanded-Android.apk
          test -s artifacts/Relanded-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Relanded-Android-APK
          path: artifacts/Relanded-Android.apk
          if-no-files-found: error
          retention-days: 7
