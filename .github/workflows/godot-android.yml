name: Build Relanded Android APK (Godot)

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Download Godot 4.5.1 and Android export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -L --fail -o "$HOME/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          curl -L --fail -o "$HOME/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp "$HOME/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          chmod +x "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"

      - name: Download licensed 3D assets
        run: |
          mkdir -p godot/models
          curl -fL --retry 3 -o godot/models/sand_tile.glb "https://cdn.3dassets.dev/assets/6833/v1/model.glb"
          curl -fL --retry 3 -o godot/models/wet_sand_tile.glb "https://cdn.3dassets.dev/assets/6834/v1/model.glb"
          curl -fL --retry 3 -o godot/models/palm_tall.glb "https://cdn.3dassets.dev/assets/6797/v1/model.glb"
          curl -fL --retry 3 -o godot/models/palm_leaning.glb "https://cdn.3dassets.dev/assets/6796/v1/model.glb"
          curl -fL --retry 3 -o godot/models/shells.glb "https://cdn.3dassets.dev/assets/6835/v1/model.glb"
          curl -fL --retry 3 -o godot/models/driftwood.glb "https://cdn.3dassets.dev/assets/6837/v1/model.glb"
          curl -fL --retry 3 -o godot/models/spring.glb "https://cdn.3dassets.dev/assets/6860/v1/model.glb"
          curl -fL --retry 3 -o godot/models/lean_to.glb "https://cdn.3dassets.dev/assets/6858/v1/model.glb"
          curl -fL --retry 3 -o godot/models/island_clearing.glb "https://cdn.3dassets.dev/assets/6866/v1/model.glb"
          curl -fL --retry 3 -o godot/models/rocky_headland.glb "https://cdn.3dassets.dev/assets/6865/v1/model.glb"
          curl -fL --retry 3 -o godot/models/sea_cave.glb "https://cdn.3dassets.dev/assets/6855/v1/model.glb"
          curl -fL --retry 3 -o godot/models/tree_fern.glb "https://cdn.3dassets.dev/assets/6827/v1/model.glb"
          curl -fL --retry 3 -o godot/models/thick_bamboo.glb "https://cdn.3dassets.dev/assets/6828/v1/model.glb"
          curl -fL --retry 3 -o godot/models/banana_clump.glb "https://cdn.3dassets.dev/assets/6822/v1/model.glb"
          curl -fL --retry 3 -o godot/models/beach_dune.glb "https://cdn.3dassets.dev/assets/6830/v1/model.glb"
          curl -fL --retry 3 -o godot/models/hiker.glb "https://tevy.dev/models/hiker/v1/lod2.glb"
          test -s godot/models/sand_tile.glb
          test -s godot/models/wet_sand_tile.glb
          test -s godot/models/hiker.glb
          test -s godot/models/island_clearing.glb
          test -s godot/models/rocky_headland.glb
          test -s godot/models/sea_cave.glb
          test -s godot/models/tree_fern.glb
          test -s godot/models/thick_bamboo.glb
          test -s godot/models/banana_clump.glb
          test -s godot/models/beach_dune.glb
          du -h godot/models/*.glb

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Import and validate project
        run: |
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --editor --path godot --quit --verbose

      - name: Export Android APK
        run: |
          mkdir -p artifacts
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path godot --export-debug --verbose "Android" ../artifacts/Relanded-Android.apk
          test -s artifacts/Relanded-Android.apk

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Relanded Android APK
          body: "APK Android compilado automaticamente pelo GitHub Actions."
          prerelease: true
          make_latest: false
          files: artifacts/Relanded-Android.apk

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relanded-Android-APK
          path: artifacts/Relanded-Android.apk
          if-no-files-found: error
          retention-days: 7
